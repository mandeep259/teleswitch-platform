#!KAMAILIO

####### Global Parameters #########

debug=3
log_stderror=yes
log_facility=LOG_LOCAL0

mpath="/usr/lib/kamailio/modules/"

# Listen on all interfaces inside container
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

####### Modules ########

# ctl.so is usually pre-loaded by the Docker entrypoint;
# commenting it here prevents the "load twice" crash.
# loadmodule "ctl.so"

loadmodule "db_mysql.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "rtpengine.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"

# ----- Database Connection String -----
# Format: mysql://user:password@container_name/database
#!define DBURL "mysql://kamailio:kamailio@kamailio-db/kamailio"

# ----- dispatcher params -----
modparam("dispatcher", "db_url", DBURL)
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_from", "sip:kamailio@kamailio")

# ----- rtpengine params -----
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:22222")

# ----- dialog params -----
modparam("dialog", "enable_stats", 1)

####### Routing Logic ########

request_route {

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Keepalive
    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    # CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # In-dialog requests
    if (has_totag()) {
        if (loose_route()) {
            xlog("L_INFO", "In-dialog  routed via loose_route to  | Call-ID=\n");

            # If mid-call SDP change occurs
            if (has_body("application/sdp")) {
                rtpengine_offer("replace-origin replace-session-connection trust-address");
            }

            t_relay();
            exit;
        }
        sl_send_reply("404", "Not here");
        exit;
    }

    # Only allow INVITE and OPTIONS
    if (!is_method("INVITE|OPTIONS")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # New INVITE
    if (is_method("INVITE")) {

        xlog("L_INFO", "New INVITE  ->  | Call-ID= | Src=:\n");

        record_route();
        dlg_manage();

        # RTPengine SDP offer
        if (has_body("application/sdp")) {
            rtpengine_offer("replace-origin replace-session-connection trust-address");
        }

        # Select FreeSWITCH destination from dispatcher setid=1 (loaded from DB)
        if (!ds_select_dst("1", "4")) {
            xlog("L_ERR", "Dispatcher: No destination available for setid=1 | Call-ID=\n");
            sl_send_reply("503", "No destination available");
            exit;
        }

        xlog("L_INFO", "Dispatcher selected destination:  | Call-ID=\n");

        if (!t_relay()) {
            xlog("L_ERR", "t_relay() failed | Call-ID=\n");
            sl_reply_error();
        }

        exit;
    }

    sl_send_reply("404", "Not Found");
    exit;
}

onreply_route {
    xlog("L_INFO", "Reply   for Call-ID= from :\n");

    if (has_body("application/sdp")) {
        rtpengine_answer("replace-origin replace-session-connection trust-address");
    }
}
