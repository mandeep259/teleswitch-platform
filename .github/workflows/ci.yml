name: Platform CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, "feat/*", "kamailio/*"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pre-commit
      - name: Create dummy .env for validation
        run: touch .env
      - name: Run Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  build-and-store:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Added kamailio to the build matrix
        service: [teleswitch, teleplivo, kamailio, rtpengine]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  integration-test:
    needs: build-and-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Runner Permissions for CI
        run: |
          mkdir -p teleswitch/logs teleswitch/db teleswitch/recordings
          chmod -R 777 teleswitch/logs teleswitch/db teleswitch/recordings

      - name: Materialize Environment
        run: |
          echo "${{ secrets.PLATFORM_ENV_FILE }}" > .env
          echo "EXTERNAL_SIP_IP=127.0.0.1" >> .env
          echo "EXTERNAL_RTP_IP=127.0.0.1" >> .env

          SHORT_SHA=$(git rev-parse --short HEAD)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "TELESWITCH_IMAGE=ghcr.io/${REPO_LOWER}/teleswitch:sha-${SHORT_SHA}" >> .env
          echo "TELEPLIVO_IMAGE=ghcr.io/${REPO_LOWER}/teleplivo:sha-${SHORT_SHA}" >> .env
          echo "KAMAILIO_IMAGE=ghcr.io/${REPO_LOWER}/kamailio:sha-${SHORT_SHA}" >> .env
          echo "RTPENGINE_IMAGE=ghcr.io/${REPO_LOWER}/rtpengine:sha-${SHORT_SHA}" >> .env

      - name: Start Stack
        run: docker compose up -d

      - name: Wait for Healthchecks
        run: |
          echo "Waiting for Services (Teleswitch, Teleplivo, Kamailio-DB) health status..."
          timeout 180s bash -c '
          until [ "$(docker inspect -f {{.State.Health.Status}} teleswitch)" == "healthy" ] && \
                [ "$(docker inspect -f {{.State.Health.Status}} teleplivo)" == "healthy" ] && \
                [ "$(docker inspect -f {{.State.Health.Status}} kamailio-db)" == "healthy" ]; do
            sleep 10
          done'

      - name: Wait for Services and Final Smoke Test
        run: |
          echo "Waiting for Kamailio to be healthy..."
          # Wait up to 60 seconds for Kamailio to report healthy
          for i in {1..12}; do
            if docker compose ps | grep kamailio | grep -q "healthy"; then
              echo "Kamailio is healthy!"
              break
            fi
            echo "Waiting..."
            sleep 5
            if [ $i -eq 12 ]; then
              echo "Error: Kamailio failed to become healthy. Logs:"
              docker compose logs kamailio
              exit 1
            fi
          done

          echo "Verifying Teleplivo API availability..."
          curl -f http://localhost:8085/actuator/health

      - name: Cleanup & Logs on Failure
        if: failure()
        run: |
          docker compose logs
          docker ps -a
