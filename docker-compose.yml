version: "3.9"

services:

  teleswitch:
    image: ${TELESWITCH_IMAGE:-teleswitch:9.4-prod}
    build:
      context: ./teleswitch
      dockerfile: Dockerfile
    container_name: teleswitch_alma_new

    restart: unless-stopped

    environment:
      TELE_HOME: /home/teleswitch/teleswitch
      TELE_CONF: /home/teleswitch/teleswitch/etc/teleswitch
      TELE_LOG: /home/teleswitch/teleswitch/var/log/teleswitch

      EXTERNAL_SIP_IP: 192.168.1.250
      EXTERNAL_RTP_IP: 192.168.1.250
      RTP_START_PORT: 18000
      RTP_END_PORT: 18005
      MAX_SESSIONS: 1000
      SESSION_RATE: 200

    ports:
      - "5070:5060/udp"
      - "5070:5060/tcp"
      - "18000-18005:18000-18005/udp"

    expose:
      - "8021"

    volumes:
      - ./teleswitch/config:/home/teleswitch/teleswitch/etc/teleswitch:ro
      - ./teleswitch/logs:/home/teleswitch/teleswitch/var/log/teleswitch
      - ./teleswitch/db:/var/lib/freeswitch/db
      - ./teleswitch/recordings:/var/lib/freeswitch/recordings

    cap_add:
      - SYS_NICE

    ulimits:
      rtprio: 65353
      nofile:
        soft: 1048576
        hard: 1048576

    networks:
      - sip_network



  teleplivo:
    image: ${TELEPLIVO_IMAGE:-teleplivo:latest}
    build: ./teleplivo
    container_name: teleplivo

    restart: always

    ports:
      - "8085:8085"

    env_file:
      - .env

    environment:
      FREESWITCH_IP: teleswitch
      FREESWITCH_PORT: 8021
      SERVER_ID: teleplivo-01

    volumes:
      - ./teleplivo/config:/config
      - ./teleplivo/logs/teleplivo-logs/:/app/logs
      - ./teleplivo/logs/TelePlivoCDR/:/app/TelePlivoCDR


    ulimits:
      nofile:
        soft: 500000
        hard: 500000

    depends_on:
      teleswitch:
        condition: service_healthy

    networks:
      - sip_network



networks:
  sip_network:
    driver: bridge
