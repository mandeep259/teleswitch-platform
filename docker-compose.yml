version: "3.9"

services:

  teleswitch:
    image: ${TELESWITCH_IMAGE:-teleswitch:9.4-prod}
    build:
      context: ./teleswitch
      dockerfile: Dockerfile
    container_name: teleswitch
    restart: unless-stopped
    environment:
      TELE_HOME: /home/teleswitch/teleswitch
      TELE_CONF: /home/teleswitch/teleswitch/etc/teleswitch
      TELE_LOG: /home/teleswitch/teleswitch/var/log/teleswitch
      EXTERNAL_SIP_IP: 192.168.1.250
      EXTERNAL_RTP_IP: 192.168.1.250
      RTP_START_PORT: 18000
      RTP_END_PORT: 18005
      MAX_SESSIONS: 1000
      SESSION_RATE: 200
    ports:
      - "5070:5060/udp"
      - "5070:5060/tcp"
      - "18000-18005:18000-18005/udp"
    expose:
      - "8021"
    volumes:
      - ./teleswitch/config:/home/teleswitch/teleswitch/etc/teleswitch:ro
      - ./teleswitch/logs:/home/teleswitch/teleswitch/var/log/teleswitch
      - ./teleswitch/db:/var/lib/freeswitch/db
      - ./teleswitch/recordings:/var/lib/freeswitch/recordings
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 65353
      nofile:
        soft: 1048576
        hard: 1048576

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - sip_network

  teleplivo:
    image: ${TELEPLIVO_IMAGE:-teleplivo:latest}
    build: ./teleplivo
    container_name: teleplivo
    restart: always
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      FREESWITCH_IP: teleswitch
      FREESWITCH_PORT: 8021
      SERVER_ID: teleplivo-01
    volumes:
      - ./teleplivo/config:/config
      - ./teleplivo/logs/teleplivo-logs/:/app/logs
      - ./teleplivo/logs/TelePlivoCDR/:/app/TelePlivoCDR
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    depends_on:
      teleswitch:
        condition: service_healthy
    networks:
      - sip_network

  kamailio-db:
    image: mariadb:10.11
    container_name: kamailio-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: telemune@2026#
      MYSQL_DATABASE: kamailio
      MYSQL_USER: kamailio
      MYSQL_PASSWORD: kamailio
    volumes:
      - kamailio_db_data:/var/lib/mysql
      - ./kamailio/db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kamailio", "-pkamailio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sip_network

  kamailio:
    #    image: ${KAMAILIO_IMAGE:-kamailio/kamailio:5.8-alpine}
    build: ./kamailio
    container_name: kamailio
    restart: unless-stopped
    # Use -DD to keep it in foreground and -E to log to stderr
    #    command: ["kamailio", "-DD", "-E", "-f", "/etc/kamailio/kamailio.cfg"]
    # command: kamailio -DD -E -f /etc/kamailio/kamailio.cfg
    # Use entrypoint to clear out any inherited junk
    #    entrypoint: ["kamailio", "-DD", "-E", "-f", "/etc/kamailio/kamailio.cfg"]
    entrypoint: /bin/sh -c "mkdir -p /var/run/kamailio && chown kamailio:kamailio /var/run/kamailio && exec kamailio -DD -E -f /etc/kamailio/kamailio.cfg"
    environment:
      - DB_URL=mysql://kamailio:kamailio@kamailio-db:3306/kamailio
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./kamailio/config/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    depends_on:
      kamailio-db:
        condition: service_healthy
    networks:
      - sip_network

    healthcheck:
      #      test: ["CMD", "kamcmd", "core.ping"]
      #      test: ["CMD", "nc", "-z", "localhost", "5060"]
      test: ["CMD", "kamcmd", "core.ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  rtpengine:
    image: ${RTPENGINE_IMAGE:-rtpengine:latest}
    build: ./rtpengine
    container_name: rtpengine
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP:-127.0.0.1}
    ports:
      - "22222:22222/udp"
      - "30000-30005:30000-30005/udp"
    networks:
      - sip_network
    # --- Fix Indentation below ---
    volumes:
      - ./rtpengine/config/rtpengine.conf.template:/etc/rtpengine/rtpengine.conf.template   # Remove :ro if it's there
      - ./rtpengine/scripts:/usr/local/bin
    entrypoint: /usr/local/bin/entrypoint.sh


networks:
  sip_network:
    driver: bridge

volumes:
  kamailio_db_data:
